# ===============================
# Gradle JVM & Performance
# ===============================
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Increase Gradle memory and add Java 17+ module opens
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC --add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED

# ===============================
# Android Settings
# ===============================
android.useAndroidX=true
android.nonTransitiveRClass=true

# ===============================
# Kotlin Settings
# ===============================
kotlin.code.style=official
# Increase Kotlin daemon memory and include JDK 17+ exports
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 --add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED

# Kotlin execution strategy fallback
kotlin.compiler.execution.strategy=in-process
kotlin.compiler.fallback.to.in.process=true

# Kapt stability fixes (disable worker API to prevent Kotlin daemon lifecycle conflict)
kapt.use.worker.api=false
kapt.incremental.apt=true
kapt.include.compile.classpath=false

android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false

